<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماركت محافظات مصر</title>
<style>
body{ font-family: Tahoma, sans-serif; background: #f4f7fb; padding: 20px; direction: rtl; }
.btn-city { display: inline-block; width: 45%; margin: 5px; padding: 10px; background: #0b6fc2; color: white; border: none; border-radius: 10px; cursor: pointer; }
.card{ background: white; padding: 15px; border-radius: 15px; margin-top: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
img{ width: 100%; border-radius: 10px; }
</style>
</head>
<body>
<h1>🛒 ماركت محافظات مصر</h1>
<div>
    <button class="btn-city" onclick="loadProducts('القاهرة')">القاهرة</button>
    <button class="btn-city" onclick="loadProducts('الجيزة')">الجيزة</button>
    <button class="btn-city" onclick="loadProducts('الإسكندرية')">الإسكندرية</button>
    <button class="btn-city" onclick="loadProducts('سوهاج')">سوهاج</button>
    <button class="btn-city" onclick="loadProducts('أسيوط')">أسيوط</button>
    <button class="btn-city" onclick="loadProducts('المنيا')">المنيا</button>
</div>
<div id="products"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyt89cTue2f-c1Fk1VM_2KEgBW0fhFXFyq6mckjRx3mCjWZ45TdNk1vZQIEVLuFDAA/exec";

async function loadProducts(city){
  const box = document.getElementById("products");
  box.innerHTML = "⏳ جاري التحميل...";
  const res = await fetch(`${API_URL}?action=getProductsByLocation&city=${encodeURIComponent(city)}`);
  const data = await res.json();
  
  if(!data.success || data.products.length === 0) {
    box.innerHTML = `<p style="text-align:center;">لا توجد منتجات في ${city} حالياً</p>`;
    return;
  }
  
  box.innerHTML = "";
  data.products.forEach(p => {
    box.innerHTML += `
      <div class="card">
        <img src="${p.image}" style="width:100px;">
        <h3>${p.name}</h3>
        <p>💰 ${p.price} جنيه</p>
        <p>القسم: ${p.category}</p>
        <a href="https://wa.me/${String(p.whatsapp).replace(/\D/g,'')}">📞 طلب المنتج</a>
      </div>`;
  });
}
</script>
</body>
</html>
