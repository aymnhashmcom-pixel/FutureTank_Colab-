<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyt89cTue2f-c1Fk1VM_2KEgBW0fhFXFyq6mckjRx3mCjWZ45TdNk1vZQIEVLuFDAA/exec";

async function loadProducts(city = "القاهرة"){ // يمكنك تمرير اسم المحافظة هنا
  const box = document.getElementById("products");
  box.innerHTML = `<div class="loading">⏳ جاري تحميل العروض في ${city}...</div>`;
  try {
    const res = await fetch(`${API_URL}?action=getProductsByLocation&city=${encodeURIComponent(city)}`);
    const data = await res.json();
    
    if(!data.success || !data.products || data.products.length === 0){
      box.innerHTML = `<div class="card" style="text-align:center; color:#666;">لا توجد سلع معروضة حالياً في ${city}</div>`;
      return;
    }
    
    box.innerHTML = "";
    for(const p of data.products){
      const phone = String(p.whatsapp || "201150402031").replace(/\D/g,'');
      const msg = encodeURIComponent("مرحباً يا تاجر، أرغب في شراء: " + p.name);
      
      box.innerHTML += `
        <div class="card">
          <img src="${p.image || 'https://via.placeholder.com/220'}" alt="${p.name}">
          <h2 class="product-title">${p.name}</h2>
          <p class="merchant-name">🏬 القسم: ${p.category}</p>
          <p class="price">💰 <b>${p.price} جنيه</b></p>
          <p class="desc">${p.desc}</p>
          <a class="btn" href="https://wa.me/${phone}?text=${msg}" target="_blank">📞 طلب السلعة وتوصيل للمنزل</a>
        </div>
      `;
    }
  } catch(e) {
    box.innerHTML = `<div class="error-msg">❌ خطأ في تحميل البيانات.</div>`;
  }
}
loadProducts(); // استدعاء تلقائي
</script>
